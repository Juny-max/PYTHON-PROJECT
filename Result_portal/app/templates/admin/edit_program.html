{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <h2>Edit Program</h2>
  <form method="post">
    <div class="form-group mb-3">
      <label for="edit_program_name">Program Name</label>
      <input type="text" class="form-control" id="edit_program_name" name="edit_program_name" value="{{ program.name }}" required>
    </div>
    <div class="form-group mb-3">
      <label for="edit_program_description">Description</label>
      <input type="text" class="form-control" id="edit_program_description" name="edit_program_description" value="{{ program.description }}">
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin.manage_programs', program_id=program.id) }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
